<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:description" content="Plataforma de orquestación multi-agente con oficina virtual pixel-art estilo GameBoy Pokémon." />
  <meta property="og:image" content="/og-image.png" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SeeControl - Orquestación Multi-Agente" />
  <meta name="twitter:description" content="Plataforma de orquestación multi-agente con oficina virtual pixel-art estilo GameBoy Pokémon." />
  <meta name="twitter:image" content="/og-image.png" />
  
  <!-- ============================================
       TÍTULO Y FAVICON
       ============================================ -->
  <title>SeeControl - Orquestación Multi-Agente | BYOK Pixel Art Office</title>
  
  <!-- Favicon SVG - Logo de SeeControl estilo GameBoy -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0A0A'/><rect x='4' y='4' width='24' height='24' fill='%231A1A1A' rx='2'/><rect x='8' y='8' width='16' height='16' fill='%232A2A2A' rx='1'/><circle cx='16' cy='16' r='4' fill='%2300BFFF'/><rect x='12' y='12' width='8' height='2' fill='%23FFFFFF'/><rect x='14' y='18' width='4' height='2' fill='%23FFFFFF'/></svg>" />
  
  <!-- ============================================
       FUENTES - ESTILO GAMEBOY
       ============================================ -->
  
  <!-- Press Start 2P - Fuente principal estilo GameBoy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Fuente alternativa para números (más legible) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- ============================================
       ESTILOS CSS - TAILWIND + CUSTOM
       ============================================ -->
  
  <!-- Tailwind CSS via CDN (para desarrollo rápido) -->
  <!-- En producción, esto será reemplazado por el build de Vite -->
  
  <!-- Estilos custom de GameBoy -->
  <style>
    /* ============================================
       RESET Y ESTILOS BASE
       ============================================ */
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Estilo pixelado para toda la aplicación */
    body {
      font-family: 'Press Start 2P', 'Orbitron', 'Courier New', monospace;
      background: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      overflow-x: hidden;
      
      /* Fondo con cuadrícula sutil estilo GameBoy */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    /* Scrollbar estilo GameBoy */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1A1A1A;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #2A2A2A;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #00BFFF;
    }
    
    /* Selección de texto */
    ::selection {
      background: #00BFFF;
      color: #000;
    }
    
    /* ============================================
       EFECTOS GAMEBOY
       ============================================ */
    
    /* Efecto CRT (Tubos de Rayos Catódicos) */
    .crt-effect {
      position: relative;
    }
    
    .crt-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 100;
      
      /* Scanlines - líneas horizontales */
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 2px
      );
    }
    
    /* Efecto de parpadeo estilo GameBoy */
    .gameboy-flicker {
      animation: gameboy-flicker 2.5s ease-in-out infinite;
    }
    
    @keyframes gameboy-flicker {
      0%, 100% { opacity: 1; filter: brightness(1); }
      92% { opacity: 1; filter: brightness(1); }
      93% { opacity: 0.98; filter: brightness(0.98); }
      94% { opacity: 1; filter: brightness(1); }
      95% { opacity: 0.99; filter: brightness(0.99); }
      96% { opacity: 1; filter: brightness(1); }
    }
    
    /* Efecto de encendido/apagado */
    .power-on {
      animation: power-on 0.5s ease-out;
    }
    
    @keyframes power-on {
      0% { opacity: 0; transform: scale(0.95); filter: brightness(0); }
      50% { opacity: 0.5; transform: scale(1.02); filter: brightness(1.2); }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }
    
    /* ============================================
       ESTILOS DE CARGA
       ============================================ */
    
    /* Animación de carga estilo GameBoy */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-logo {
      width: 64px;
      height: 64px;
      background: 
        /* Logo de SeeControl estilo pixel art */
        linear-gradient(45deg, #00BFFF 25%, transparent 25%),
        linear-gradient(-45deg, #00BFFF 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #00BFFF 75%),
        linear-gradient(-45deg, transparent 75%, #00BFFF 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      border: 4px solid #00BFFF;
      border-radius: 8px;
      animation: logo-pulse 2s ease-in-out infinite;
      margin-bottom: 16px;
    }
    
    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    .loading-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #FFFFFF;
      text-align: center;
      animation: loading-text 1s ease-in-out infinite;
    }
    
    @keyframes loading-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading-bar {
      width: 200px;
      height: 8px;
      background: #1A1A1A;
      border: 2px solid #2A2A2A;
      border-radius: 4px;
      margin-top: 16px;
      overflow: hidden;
    }
    
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00BFFF, #FF69B4, #00FF7F, #FFFF00);
      border-radius: 4px;
      animation: loading-bar 1.5s ease-in-out infinite;
    }
    
    @keyframes loading-bar {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
    
    /* ============================================
       ESTILOS DE LA OFICINA
       ============================================ */
    
    /* Contenedor de la oficina */
    .office-preview {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* Grid de la oficina */
    .office-grid-preview {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 8px;
      background: #1A1A1A;
      border: 2px solid #2A2A2A;
      border-radius: 8px;
    }
    
    .office-cell-preview {
      aspect-ratio: 1 / 2;
      background: #2A2A2A;
      border: 1px solid #3A3A3A;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* ============================================
       BOTONES ESTILO GAMEBOY
       ============================================ */
    
    /* Botones A, B, X, Y estilo GameBoy */
    .gameboy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 0 rgba(0, 0, 0, 0.5);
    }
    
    .gameboy-button:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0 0 rgba(0, 0, 0, 0.5);
    }
    
    .gameboy-button:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0 0 rgba(0, 0, 0, 0.5);
    }
    
    .gameboy-button-a {
      background: #FF69B4;
      color: #000;
    }
    
    .gameboy-button-b {
      background: #00BFFF;
      color: #FFF;
    }
    
    .gameboy-button-x {
      background: #00FF7F;
      color: #000;
    }
    
    .gameboy-button-y {
      background: #FFFF00;
      color: #000;
    }
    
    /* Botones direccionales */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 80px;
      height: 80px;
      gap: 4px;
    }
    
    .d-pad-button {
      background: #3A3A3A;
      border: 2px solid #000;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    
    .d-pad-button:hover {
      background: #4A4A4A;
    }
    
    .d-pad-button:active {
      background: #6A6A6A;
      transform: scale(0.9);
    }
    
    .d-pad-center {
      grid-column: 2;
      grid-row: 2;
    }
    
    /* ============================================
       ESTILOS DE LOS PERSONAJES (PREVIEW)
       ============================================ */
    
    /* Sprite placeholder para personajes */
    .character-placeholder {
      width: 16px;
      height: 32px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      animation: character-float 3s ease-in-out infinite;
    }
    
    @keyframes character-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    
    /* Colores de personajes */
    .character-luna { background: linear-gradient(to bottom, #FF69B4 50%, #000 50%); }
    .character-max { background: linear-gradient(to bottom, #00BFFF 50%, #000 50%); }
    .character-pixel { background: linear-gradient(to bottom, #32CD32 50%, #000 50%); }
    .character-data { background: linear-gradient(to bottom, #00FFFF 50%, #000 50%); }
    .character-scout { background: linear-gradient(to bottom, #FFD700 50%, #000 50%); }
    .character-layout { background: linear-gradient(to bottom, #FFA500 50%, #000 50%); }
    .character-boss { 
      width: 24px; 
      background: linear-gradient(to bottom, #FFD700 50%, #800080 50%); 
    }
    .character-nex { background: linear-gradient(to bottom, #00FF7F 50%, #000 50%); }
    
    /* ============================================
       ESTILOS RESPONSIVE
       ============================================ */
    
    @media (max-width: 768px) {
      .office-grid-preview {
        grid-template-columns: repeat(4, 1fr);
      }
      
      .gameboy-button {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      
      .d-pad {
        width: 64px;
        height: 64px;
      }
    }
    
    @media (max-width: 480px) {
      .office-grid-preview {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    /* ============================================
       ESTILOS DE ACCESIBILIDAD
       ============================================ */
    
    /* Enfoque para teclado */
    :focus-visible {
      outline: 2px solid #00BFFF;
      outline-offset: 2px;
    }
    
    /* Reducción de movimiento para quienes lo prefieren */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- ============================================
       CARGA INICIAL
       ============================================ -->
  <div id="loading" class="loading power-on">
    <div class="loading-logo"></div>
    <div class="loading-text">SEE CONTROL</div>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
  
  <!-- ============================================
       CONTENIDO PRINCIPAL
       ============================================ -->
  <div id="root"></div>
  
  <!-- ============================================
       SCRIPTS
       ============================================ -->
  <script type="module">
    // Animación de carga
    window.addEventListener('load', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        setTimeout(() => {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 500);
        }, 1000);
      }
    });
    
    // Aplicar efecto CRT al body
    document.body.classList.add('crt-effect', 'gameboy-flicker');
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
